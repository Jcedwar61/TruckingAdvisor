name: Build, test & package

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag v<version>) with the installer"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs on every push and pull request, so it gets no write or signing permissions; the release job attests.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VERSION: 3.9.0
    steps:
      - uses: actions/checkout@v4

      - name: Check version (VERSION = app version; a version tag must be v<VERSION>)
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path src\TruckingAdvisor.UI\TruckingAdvisor.UI.csproj -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $m) { throw "No <Version> in src/TruckingAdvisor.UI/TruckingAdvisor.UI.csproj" }
          $app = $m.Matches[0].Groups[1].Value
          if ($app -ne $env:VERSION) { throw "VERSION ($env:VERSION) differs from the app's <Version> ($app)" }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -cne "v$env:VERSION") { throw "Tag $env:GITHUB_REF_NAME does not match v$env:VERSION" }
          "version=$env:VERSION" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, build and test
        run: |
          dotnet restore TruckingAdvisor.sln
          dotnet build TruckingAdvisor.sln -c Release --no-restore
          dotnet test TruckingAdvisor.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis --version 3.10 -y --no-progress }

      - name: Build app and installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:VERSION

      - name: Smoke test - silent install, launch, uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "TA-install"
          Start-Process "publish\TruckingAdvisor-Setup-$env:VERSION.exe" -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path "$dir\TruckingAdvisor.exe")) { throw "Installer did not install TruckingAdvisor.exe" }
          if (-not (Test-Path "$dir\Uninstall.exe")) { throw "Installer did not write the uninstaller" }
          $uninst = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TruckingAdvisor"
          if ($uninst.DisplayVersion -ne $env:VERSION) { throw "Installed-apps entry missing or wrong version" }

          # The app must start and keep running (no crash on startup).
          $p = Start-Process "$dir\TruckingAdvisor.exe" -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "TruckingAdvisor.exe exited during startup (code $($p.ExitCode))" }

          # Auto-update path: the installer in update mode must wait for the running app, install,
          # relaunch it, and not re-add a desktop shortcut the player removed.
          $desktopLnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "TruckingAdvisor.lnk"
          Remove-Item $desktopLnk -ErrorAction SilentlyContinue
          $u = Start-Process "publish\TruckingAdvisor-Setup-$env:VERSION.exe" -ArgumentList "/S", "/UPDATE", "/RELAUNCH", "/D=$dir" -PassThru
          Start-Sleep -Seconds 6
          if ($u.HasExited) { throw "Update installer did not wait for the running app" }
          Stop-Process -Id $p.Id -Force
          if (-not $u.WaitForExit(90000)) { Stop-Process -Id $u.Id -Force; throw "Update installer did not finish after the app closed" }
          if ($u.ExitCode -ne 0) { throw "Update installer failed (code $($u.ExitCode))" }
          Start-Sleep -Seconds 5
          $relaunched = Get-Process TruckingAdvisor -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$dir\TruckingAdvisor.exe" }
          if (-not $relaunched) { throw "Update did not relaunch the app" }
          $relaunched | Stop-Process -Force
          if (Test-Path $desktopLnk) { throw "Update re-created a desktop shortcut the player had removed" }
          Start-Sleep -Seconds 2

          # Voices: synthesize a line with the free neural voice and a Windows voice (no speaker needed on CI).
          $voice = Join-Path $PWD "publish\screenshots"
          $v = Start-Process "$dir\TruckingAdvisor.exe" -ArgumentList "--voice-selftest", "`"$voice`"" -PassThru
          if (-not $v.WaitForExit(420000)) { Stop-Process -Id $v.Id -Force; throw "Voice self-test did not finish" }
          Get-Content "$voice\voice-selftest.txt"
          if (-not (Select-String -Path "$voice\voice-selftest.txt" -Pattern "FreeNeural: Microsoft neural voice" -Quiet)) { throw "The free neural voice did not synthesize" }
          if ((Get-Item "$voice\voice-FreeNeural.wav").Length -lt 20000) { throw "Neural voice audio is too short" }
          if (-not (Select-String -Path "$voice\voice-selftest.txt" -Pattern "FreeNeural playback chain: [1-9]" -Quiet)) { throw "The playback chain failed (radio filter / speaker conversion)" }
          if (-not (Select-String -Path "$voice\voice-selftest.txt" -Pattern "Windows: Windows voice" -Quiet)) { Write-Warning "Windows voice fallback did not synthesize on this runner" }
          # Speech recognition: local Whisper must understand the neural voice's line.
          $heard = Select-String -Path "$voice\voice-selftest.txt" -Pattern 'Whisper base\.en: "(.*)"' | Select-Object -First 1
          if (-not $heard) { throw "Local Whisper (base.en, the default) did not transcribe" }
          if ($heard.Matches[0].Groups[1].Value -notmatch '(?i)big red' -or $heard.Matches[0].Groups[1].Value -notmatch '(?i)copy') { throw "Whisper misheard: $($heard.Matches[0].Groups[1].Value)" }

          # Render every tab to PNG so the UI can be reviewed without a Windows PC.
          $shots = Join-Path $PWD "publish\screenshots"
          $s = Start-Process "$dir\TruckingAdvisor.exe" -ArgumentList "--demo", "--screenshot", "`"$shots`"" -PassThru
          if (-not $s.WaitForExit(90000)) { Stop-Process -Id $s.Id -Force; throw "Screenshot mode did not finish" }
          if (Test-Path "$shots\error.txt") { Get-Content "$shots\error.txt"; throw "Screenshot mode failed" }
          if (-not (Test-Path "$shots\dashboard.png")) { throw "No screenshots were produced" }

          Start-Process "$dir\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5   # the NSIS uninstaller finishes from a temp copy
          if (Test-Path "$dir\TruckingAdvisor.exe") { throw "Uninstaller left the app behind" }
          if (Test-Path "$dir\runtimes") { Get-ChildItem "$dir\runtimes" -Recurse | Select-Object -ExpandProperty FullName; throw "Uninstaller left runtime files behind" }

      - name: Telemetry plugin checksum (pinned value must match the official release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/RenCloud/scs-sdk-plugin/releases/tags/V.1.12.1 | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '\.(zip|dll)$' } | Select-Object -First 1
          if (-not $asset) { throw "No plugin asset found on the V.1.12.1 release" }
          $file = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest $asset.browser_download_url -OutFile $file
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$sha  $($asset.name)" | Set-Content "publish\screenshots\plugin-sha256.txt"
          $m = Select-String -Path src\TruckingAdvisor.Telemetry\GitHubPluginInstallerService.cs -Pattern 'ExpectedAssetSha256: "([0-9a-f]{64})"' | Select-Object -First 1
          $pinned = if ($m) { $m.Matches[0].Groups[1].Value } else { "" }
          if (-not $pinned) { throw "Could not read the pinned plugin checksum (ExpectedAssetSha256) from GitHubPluginInstallerService.cs" }
          Write-Host "Official asset $($asset.name): $sha (pinned: '$pinned')"
          if ($pinned -ne $sha) { throw "Pinned plugin checksum does not match the official release asset" }
          # Plugins/plugin_manifest.json documents the same pin; it must not drift from the code.
          $entry = (Get-Content Plugins\plugin_manifest.json -Raw | ConvertFrom-Json).plugins | Where-Object { $_.id -eq 'scs-sdk-plugin' } | Select-Object -First 1
          if (-not $entry) { throw "Plugins/plugin_manifest.json has no scs-sdk-plugin entry" }
          if ($entry.sha256 -cne $pinned) { throw "Plugins/plugin_manifest.json sha256 ($($entry.sha256)) differs from the pinned checksum ($pinned)" }
          if ($entry.releaseTag -cne 'V.1.12.1') { throw "Plugins/plugin_manifest.json releaseTag ($($entry.releaseTag)) differs from the pinned release V.1.12.1" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem publish -Filter *.exe -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content publish/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: TruckingAdvisor-Setup-win-x64
          path: |
            publish/TruckingAdvisor-Setup-*.exe
            publish/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            publish/screenshots/*.png
            publish/screenshots/*.txt

  # Publishes a GitHub Release with the installer when a version tag v<VERSION> is pushed for a commit on main,
  # or when the workflow is run by hand on main with "release" ticked (then it creates the tag itself).
  # The app installs updates by itself, so nothing from another branch may ever become a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the tag and the release
      id-token: write       # build provenance attestation
      attestations: write
    env:
      VERSION: 3.9.0
      BUILD_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # main's history and the tags, for the checks below
      - uses: actions/download-artifact@v4
        with:
          name: TruckingAdvisor-Setup-win-x64
          path: dist
      - name: Check what is being released
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ "$BUILD_VERSION" = "$VERSION" ] || fail "VERSION differs between the build job ($BUILD_VERSION) and the release job ($VERSION)"
          app=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' src/TruckingAdvisor.UI/TruckingAdvisor.UI.csproj | head -n1)
          [ "$app" = "$VERSION" ] || fail "VERSION ($VERSION) differs from the app's <Version> ($app)"
          head=$(git rev-parse 'HEAD^{commit}')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$GITHUB_REF_NAME" = "v$VERSION" ] || fail "Tag $GITHUB_REF_NAME does not match v$VERSION"
          else
            [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Releases are only made from main (this run is on $GITHUB_REF)"
            if existing=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}"); then
              [ "$existing" = "$head" ] || fail "Tag v$VERSION already exists on another commit ($existing)"
            fi
          fi
          git merge-base --is-ancestor "$head" origin/main || fail "Commit $head is not on main; releases are only made from main"
          [ -f "dist/TruckingAdvisor-Setup-$VERSION.exe" ] || fail "The build has no TruckingAdvisor-Setup-$VERSION.exe"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/TruckingAdvisor-Setup-*.exe'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else tag="v${VERSION}"; fi
          notes=$(awk -v ver="${tag#v}" '$0 ~ "^## \\[v"ver"\\]" {p=1; next} /^## \[v/ && p {exit} p' CHANGELOG.md)
          [ -n "$notes" ] || notes="TruckingAdvisor ${tag}"
          printf '%s\n\n%s\n' "$notes" "Install: download TruckingAdvisor-Setup-${tag#v}.exe and run it (64-bit Windows 10/11, no admin needed). SmartScreen may warn because it isn't code-signed: More info > Run anyway. Verify with SHA256SUMS.txt." > notes.md
          gh release create "$tag" dist/* --title "TruckingAdvisor ${tag}" --notes-file notes.md --target "$GITHUB_SHA"

  # Publishes the rendered UI screenshots to the ci-screenshots branch (used by the README).
  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Push to ci-screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "UI screenshots rendered by CI from commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), demo data." > README.md
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
