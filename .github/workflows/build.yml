name: Build, test & package

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag v<version>) with the installer"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # only used for release attestation on tags
      attestations: write
    env:
      VERSION: 2.8.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, build and test
        run: |
          dotnet restore TruckingAdvisor.sln
          dotnet build TruckingAdvisor.sln -c Release --no-restore
          dotnet test TruckingAdvisor.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build app and installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:VERSION

      - name: Smoke test - silent install, launch, uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "TA-install"
          Start-Process "publish\TruckingAdvisor-Setup-$env:VERSION.exe" -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path "$dir\TruckingAdvisor.exe")) { throw "Installer did not install TruckingAdvisor.exe" }
          if (-not (Test-Path "$dir\Uninstall.exe")) { throw "Installer did not write the uninstaller" }
          $uninst = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TruckingAdvisor"
          if ($uninst.DisplayVersion -ne $env:VERSION) { throw "Installed-apps entry missing or wrong version" }

          # The app must start and keep running (no crash on startup).
          $p = Start-Process "$dir\TruckingAdvisor.exe" -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "TruckingAdvisor.exe exited during startup (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

          # Render every tab to PNG so the UI can be reviewed without a Windows PC.
          $shots = Join-Path $PWD "publish\screenshots"
          $s = Start-Process "$dir\TruckingAdvisor.exe" -ArgumentList "--demo", "--screenshot", "`"$shots`"" -PassThru
          if (-not $s.WaitForExit(90000)) { Stop-Process -Id $s.Id -Force; throw "Screenshot mode did not finish" }
          if (Test-Path "$shots\error.txt") { Get-Content "$shots\error.txt"; throw "Screenshot mode failed" }
          if (-not (Test-Path "$shots\dashboard.png")) { throw "No screenshots were produced" }

          Start-Process "$dir\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5   # the NSIS uninstaller finishes from a temp copy
          if (Test-Path "$dir\TruckingAdvisor.exe") { throw "Uninstaller left the app behind" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem publish -Filter *.exe -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content publish/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: TruckingAdvisor-Setup-win-x64
          path: |
            publish/TruckingAdvisor-Setup-*.exe
            publish/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: publish/screenshots/*.png

      - name: Attest build provenance (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'publish/TruckingAdvisor-Setup-*.exe'

  # Publishes a GitHub Release with the installer when a version tag (v2.4.0, ...) is pushed,
  # or when the workflow is run by hand with "release" ticked (then it creates the tag itself).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 2.8.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TruckingAdvisor-Setup-win-x64
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else tag="v${VERSION}"; fi
          notes=$(awk -v ver="${tag#v}" '$0 ~ "^## \\[v"ver"\\]" {p=1; next} /^## \[v/ && p {exit} p' CHANGELOG.md)
          [ -n "$notes" ] || notes="TruckingAdvisor ${tag}"
          printf '%s\n\n%s\n' "$notes" "Install: download TruckingAdvisor-Setup-${tag#v}.exe and run it (64-bit Windows 10/11, no admin needed). SmartScreen may warn because it isn't code-signed: More info > Run anyway. Verify with SHA256SUMS.txt." > notes.md
          gh release create "$tag" dist/* --title "TruckingAdvisor ${tag}" --notes-file notes.md --target "$GITHUB_SHA"

  # Publishes the rendered UI screenshots to the ci-screenshots branch (used by the README).
  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Push to ci-screenshots
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "UI screenshots rendered by CI from commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), demo data." > README.md
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
